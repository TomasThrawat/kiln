name: Kiln remote MCP validation

# CircleCI owns push/PR triggers for this workflow. Keep native GitHub execution manual.
on:
  workflow_dispatch:

jobs:
  verify-vercel-mcp:
    if: github.ref == 'refs/heads/circleci/vercel-mcp-ci'
    name: Typecheck, contract tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "init.defaultBranch"
      GIT_CONFIG_VALUE_0: "main"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install adapter dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --cache /tmp/kiln-mcp-npm-cache
        working-directory: vercel-mcp

      - name: Prepare stable Next.js cache directory
        run: mkdir -p /tmp/kiln-nextjs-cache

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/kiln-nextjs-cache
          key: ${{ runner.os }}-nextjs-v2-${{ hashFiles('vercel-mcp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v2-

      - name: TypeScript validation
        run: npm run typecheck
        working-directory: vercel-mcp

      - name: Adapter contract tests
        run: npm test
        working-directory: vercel-mcp

      - name: Link and verify Next.js build cache
        run: |
          mkdir -p .next
          if [ -L .next/cache ]; then
            rm .next/cache
          elif [ -d .next/cache ]; then
            cp -a .next/cache/. /tmp/kiln-nextjs-cache/
            rm -rf .next/cache
          fi
          ln -s /tmp/kiln-nextjs-cache .next/cache
          test -d .next/cache
          echo "Cache target: $(readlink -f .next/cache)"
          echo "Cache entries:"
          find .next/cache -mindepth 1 -maxdepth 2 -print | head -n 40
        working-directory: vercel-mcp

      - name: Next.js production build
        run: npm run build
        working-directory: vercel-mcp
