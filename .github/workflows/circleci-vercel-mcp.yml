name: Kiln remote MCP validation

# CircleCI owns push/PR triggers for this workflow. Keep native GitHub execution manual.
on:
  workflow_dispatch:

jobs:
  verify-vercel-mcp:
    if: github.ref == 'refs/heads/circleci/vercel-mcp-ci'
    name: Typecheck, contract tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "init.defaultBranch"
      GIT_CONFIG_VALUE_0: "main"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install verified Node.js 22.23.4
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="v22.23.4"
          NODE_ARCHIVE="node-${NODE_VERSION}-linux-x64.tar.xz"
          NODE_DIR="${RUNNER_TEMP}/kiln-node-${NODE_VERSION}"
          mkdir -p "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/${NODE_VERSION}/${NODE_ARCHIVE}" \
            --output "${RUNNER_TEMP}/${NODE_ARCHIVE}"
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" \
            --output "${RUNNER_TEMP}/node-SHASUMS256.txt"
          grep -E "^[0-9a-f]{64}  ${NODE_ARCHIVE}$" \
            "${RUNNER_TEMP}/node-SHASUMS256.txt" \
            > "${RUNNER_TEMP}/node-checksum.txt"
          test -s "${RUNNER_TEMP}/node-checksum.txt"
          (cd "${RUNNER_TEMP}" && sha256sum --check node-checksum.txt)
          mkdir -p "${NODE_DIR}"
          tar -xJf "${RUNNER_TEMP}/${NODE_ARCHIVE}" \
            --strip-components=1 -C "${NODE_DIR}"
          echo "${NODE_DIR}/bin" >> "${GITHUB_PATH}"
          "${NODE_DIR}/bin/node" --version
          "${NODE_DIR}/bin/npm" --version

      - name: Install adapter dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --cache /tmp/kiln-mcp-npm-cache
        working-directory: vercel-mcp

      - name: Prepare stable Next.js cache directory
        run: mkdir -p /tmp/kiln-nextjs-cache

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/kiln-nextjs-cache
          key: ${{ runner.os }}-nextjs-v2-${{ hashFiles('vercel-mcp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v2-

      - name: TypeScript validation
        run: npm run typecheck
        working-directory: vercel-mcp

      - name: Adapter contract tests
        run: npm test
        working-directory: vercel-mcp

      - name: Link and verify Next.js build cache
        run: |
          set -euo pipefail
          mkdir -p .next
          if [ -L .next/cache ]; then
            rm .next/cache
          elif [ -d .next/cache ]; then
            cp -a .next/cache/. /tmp/kiln-nextjs-cache/
            rm -rf .next/cache
          fi
          ln -s /tmp/kiln-nextjs-cache .next/cache
          test -d .next/cache
          echo "Cache target: $(readlink -f .next/cache)"
          CACHE_ENTRY="$(find -L .next/cache -mindepth 1 -print -quit)"
          test -n "${CACHE_ENTRY}"
          echo "First restored cache entry: ${CACHE_ENTRY}"
          find -L .next/cache -mindepth 1 -maxdepth 2 -print | head -n 40 || true
        working-directory: vercel-mcp

      - name: Next.js production build
        run: npm run build
        working-directory: vercel-mcp
