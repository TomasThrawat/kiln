version: 2.1

jobs:
  verify-kiln-engine:
    docker:
      - image: cimg/node:22.23.3
    working_directory: ~/project
    environment:
      KILN_RENDER: cpu
    steps:
      - checkout
      - run:
          name: Prepare CI diagnostic logs
          command: mkdir -p /tmp/kiln-ci-logs
      - run:
          name: Install pinned Bun and npm
          command: |
            sudo npm install --global npm@12.2.0
            sudo npm install --global --allow-scripts=bun bun@1.4.2
            node --version
            npm --version
            bun --version
      - run:
          name: Check toolchain metadata
          command: bun run check:toolchain
      - run:
          name: Check skills
          command: bun run check:skills
      - run:
          name: Install engine dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Build SDK
          command: bun run build:sdk
      - run:
          name: TypeScript validation
          command: bun run typecheck
      - run:
          name: Lint
          command: bun run lint
      - run:
          name: Restore pinned regression inputs
          command: node scripts/example-archive.mjs --fetch
          no_output_timeout: 20m
      - run:
          name: Unit tests and coverage gate
          command: |
            set -o pipefail
            bun run test:coverage 2>&1 | tee /tmp/kiln-ci-logs/unit-tests-coverage.log
          no_output_timeout: 30m
      - run:
          name: Verify exporter worker and cache isolation
          command: node scripts/exporter-cli-check.mjs
          no_output_timeout: 20m
      - run:
          name: Engine regressions with community exporter
          command: |
            set -o pipefail
            KILN_GLTF_EXPORTER=three bun run test 2>&1 | tee /tmp/kiln-ci-logs/engine-regressions-community-exporter.log
          no_output_timeout: 30m
      - run:
          name: Build runtime and viewer bundles
          command: bun run build:runtime
          no_output_timeout: 30m
      - run:
          name: Package and smoke-test the Node distribution
          command: |
            mkdir -p /tmp/kiln-candidate
            npm pack --ignore-scripts --pack-destination /tmp/kiln-candidate
            set -- /tmp/kiln-candidate/*.tgz
            test "$#" -eq 1
            npm run test:package -- --tarball "$1"
          no_output_timeout: 30m
      - store_artifacts:
          path: /tmp/kiln-ci-logs
          destination: kiln-engine-test-logs

  verify-kiln-render-service:
    docker:
      - image: cimg/node:22.23.3
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install pinned npm
          command: sudo npm install --global npm@12.2.0
      - run:
          name: Install render-service dependencies without native build scripts
          command: npm ci --ignore-scripts
          working_directory: ~/project/render-service
      - run:
          name: Render-service tests
          command: npm test
          working_directory: ~/project/render-service

  verify-kiln-vercel-mcp:
    docker:
      - image: cimg/node:22.23.3
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          name: Restore Next.js build cache
          keys:
            - nextjs-build-v1-{{ checksum "vercel-mcp/package.json" }}-{{ checksum "vercel-mcp/next.config.ts" }}-{{ checksum "vercel-mcp/tsconfig.json" }}
      - run:
          name: Install adapter dependencies
          command: cd vercel-mcp && npm install --no-audit --no-fund
      - run:
          name: TypeScript validation
          command: cd vercel-mcp && npm run typecheck
      - run:
          name: Adapter contract tests
          command: cd vercel-mcp && npm test
      - run:
          name: Next.js production build
          command: cd vercel-mcp && npm run build
      - save_cache:
          name: Save Next.js build cache
          key: nextjs-build-v1-{{ checksum "vercel-mcp/package.json" }}-{{ checksum "vercel-mcp/next.config.ts" }}-{{ checksum "vercel-mcp/tsconfig.json" }}
          paths:
            - vercel-mcp/.next/cache

workflows:
  verify:
    jobs:
      - verify-kiln-engine
      - verify-kiln-render-service
      - verify-kiln-vercel-mcp
